<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14151C"/>
      <stop offset="100%" stop-color="#070709"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D698"/>
      <stop offset="50%" stop-color="#E6C280"/>
      <stop offset="100%" stop-color="#A57F3A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="126" stroke="#2A2C39" stroke-width="3" fill="none"/>
  
  <!-- Aether Geometric Sound Resonance Glyph -->
  <g transform="translate(256, 256)">
    <!-- Outer concentric gold harmonic rings -->
    <circle r="160" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 12"/>
    <circle r="120" fill="none" stroke="url(#gold)" stroke-width="8" stroke-opacity="0.6"/>
    <circle r="80" fill="none" stroke="url(#gold)" stroke-width="12" stroke-opacity="0.9"/>
    
    <!-- Central resonant core -->
    <polygon points="0,-48 42,24 -42,24" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="14" fill="#070709"/>
    <circle cx="0" cy="0" r="6" fill="url(#gold)"/>
  </g>
</svg>
